<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRM Login | ST Jupiter Consultancy</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/"><img class="brand-logo" src="/assets/logo.png" alt="ST Jupiter Consultancy" /></a>
      <nav class="nav-links"><a href="/">Website</a><a href="/crm">CRM</a></nav>
      <div class="header-actions"><a class="header-call" href="/crm">Open CRM</a></div>
      <button class="menu-toggle" type="button" aria-label="Open menu" aria-expanded="false"><span></span><span></span><span></span></button>
    </header>
    <main class="page-main auth-page">
      <section class="page-hero">
        <p class="eyebrow">Admin CRM</p>
        <h1>CRM Login</h1>
        <p>Website data, jobs, applications, doctors, hospitals, aur inquiries manage karne ke liye admin login.</p>
      </section>
      <section class="auth-shell single-auth">
        <form class="auth-card">
          <p class="section-kicker">Admin Access</p>
          <h2>Login to CRM</h2>
          <label>Email<input type="email" name="loginEmail" placeholder="admin@stjupiter.com" required /></label>
          <label>Password<input type="password" name="loginPassword" placeholder="Admin password" required /></label>
          <button class="btn primary" type="submit">Login</button>
        </form>
      </section>
    </main>
    <script src="/script.js"></script>
  </body>
</html>
